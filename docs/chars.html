  else { const gq = GRIP[0].clone().applyQuaternion(r.gun.quaternion).add(r.gun.position), gl = GRIP[1].clone().applyQuaternion(r.gun.quaternion).add(r.gun.position); ikArm(r.sR, r.eR, gq, POLE_R); ikArm(r.sL, r.eL, gl, POLE_L); }
  // what a living body does on its own (Rig.life): the breath, the head looking about a little
  const calm = kind === 'idle' ? 1 : 0.3, b = 0.011 * Math.sin(r.breath * (kind === 'run' ? 2.8 : 1.25)); r.torso.scale.set(1 + b * 0.4, 1 + b, 1 + b * 0.8);
  r.headP.rotation.set((0.045 * Math.sin(r.breath * 0.7 + 1)) * calm, (0.16 * Math.sin(r.breath * 0.41)) * calm, 0.035 * Math.sin(r.breath * 0.53 + 0.7) * calm);
}

const figs = []; let kind = 'idle', spin = false;
try {
  const geo = figureGeometry();
  for (const A of ARMIES) {
    const r = makeRig(A, geo);
    const tag = document.createElement('div'); tag.className = 'tag'; tag.innerHTML = `${A.name}<small>${A.sub}</small>`; document.body.appendChild(tag);
    figs.push({ r, tag, A });
  }
  document.getElementById('load').remove();
} catch (e) { document.getElementById('load').textContent = 'הטעינה נכשלה. רעננו את הדף.'; console.error(e); }
for (const b of document.querySelectorAll('#bar button[data-pose]')) b.onclick = () => { kind = b.dataset.pose; for (const x of document.querySelectorAll('#bar button[data-pose]')) x.setAttribute('aria-pressed', String(x === b)); };
bSpin.onclick = () => { spin = !spin; bSpin.setAttribute('aria-pressed', String(spin)); };
addEventListener('resize', () => { R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
const v = new THREE.Vector3(), clock = new THREE.Clock(); let t = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05); t += reduce ? 0 : dt;
  for (const { r } of figs) { r.breath += dt; if (spin) r.root.rotation.y += dt * 0.6; pose(r, kind, kind === 'run' ? t * 9 : t); }
  ctl.update(); R.render(scene, cam);
  for (const { r, tag } of figs) { v.set(r.root.position.x, 0.02, 0).project(cam); const sx = (v.x * 0.5 + 0.5) * innerWidth; tag.style.left = sx + 'px'; tag.style.top = Math.min((-v.y * 0.5 + 0.5) * innerHeight + 8, innerHeight - 118) + 'px'; tag.style.display = v.z < 1 && sx > -80 && sx < innerWidth + 80 ? '' : 'none'; }
}
R.setAnimationLoop(frame);
window.__view = { cam, ctl, setPose: (k) => { kind = k; }, frame, figs };   /* for checking it from outside */
window.__ready = true;
</script>
