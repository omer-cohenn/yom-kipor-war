<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>חדר תצוגה · טסט</title>
<style>
  :root { color-scheme: dark; --ink: #ece6d6; --dim: #b4ac96; --bg: #1d1c18; --panel: rgba(24, 23, 19, 0.9); --chip: #2c2a23; --chipOn: #4a3f22; --line: rgba(236, 230, 214, 0.18); --accent: #d8b25a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Rubik, Heebo, Arial, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }

  #panel { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 300px; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; }
  #panel h1 { margin: 0; font-size: 18px; font-weight: 700; }
  #panel p.lede { margin: 2px 0 0; color: var(--dim); font-size: 12.5px; line-height: 1.45; }
  .sec { display: flex; flex-direction: column; gap: 7px; }
  .sec > b { font-size: 12.5px; color: var(--accent); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .row button, #toggle { background: var(--chip); color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; font: inherit; font-size: 13px; cursor: pointer; line-height: 1.2; }
  .row button[aria-pressed="true"] { background: var(--chipOn); border-color: var(--accent); color: #fff; }
  .row button:focus-visible, #toggle:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .list button { text-align: start; }
  .list button small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }
  label.sl { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); }
  label.sl input { flex: 1; accent-color: var(--accent); }
  #info { font-size: 12.5px; color: var(--dim); line-height: 1.5; min-height: 2.8em; border-top: 1px solid var(--line); padding-top: 10px; }
  #info strong { color: var(--ink); font-weight: 600; }
  .tag { position: fixed; transform: translate(-50%, 0); background: rgba(20, 19, 16, 0.8); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font-size: 13px; white-space: nowrap; pointer-events: none; }
  .tag small { display: block; color: var(--dim); font-size: 11px; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 15px; }
  #toggle { position: fixed; display: none; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); z-index: 3; background: var(--chipOn); border-color: var(--accent); }

  }
</style>

    <div class="sec"><b>מודל</b><div class="list" id="mdlList"></div></div>
